name: Pull Request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint Markdown
    runs-on: "${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}"
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: domengabrovsek/github-actions/.github/actions/checkout@main

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: "**/*.md"

  budget:
    name: Config Budget
    runs-on: "${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}"
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: domengabrovsek/github-actions/.github/actions/checkout@main

      - name: Check always-loaded rule budget
        run: ./scripts/config-budget.sh

  prose:
    name: Prose Gate
    runs-on: "${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}"
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: domengabrovsek/github-actions/.github/actions/checkout@main

      - name: Test the prose gate and scan the markdown corpus
        run: bash hooks/prose-gate.test.sh

  tests:
    name: Extension Tests
    runs-on: "${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}"
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: domengabrovsek/github-actions/.github/actions/checkout@main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run pi extension tests
        run: npm test

  config:
    name: Config Integrity
    runs-on: "${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}"
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: domengabrovsek/github-actions/.github/actions/checkout@main

      - name: Check tracked configuration
        run: ./scripts/config-integrity.sh

      - name: Lint shell scripts
        run: ./scripts/shellcheck-all.sh

  shell-tests:
    name: Shell Tests
    runs-on: "${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}"
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: domengabrovsek/github-actions/.github/actions/checkout@main

      - name: Test the multi-host bootstrap
        run: bash tests/setup-hosts.sh

      - name: Test the drift check
        run: bash tests/symlink-check.sh

  # ==============================================
  # Gate
  # ==============================================
  # Single aggregator check every PR must pass. Branch protection requires the
  # "Gate" status, so required checks stay stable even as the jobs below change.
  gate:
    name: Gate
    if: always()
    needs:
      - lint
      - budget
      - prose
      - tests
      - shell-tests
      - config
    runs-on: "${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}"
    timeout-minutes: 1
    steps:
      - name: Check results
        run: |
          results=(
            "${{ needs.lint.result }}"
            "${{ needs.budget.result }}"
            "${{ needs.prose.result }}"
            "${{ needs.tests.result }}"
            "${{ needs.shell-tests.result }}"
            "${{ needs.config.result }}"
          )
          for r in "${results[@]}"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "One or more jobs failed or were cancelled."
              exit 1
            fi
          done
          echo "All jobs passed or were skipped."
