name: Pull Request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint Markdown
    runs-on: "${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}"
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: domengabrovsek/github-actions/.github/actions/checkout@main

      - name: Lint Markdown
        uses: domengabrovsek/github-actions/.github/actions/markdownlint@main
        with:
          globs: "**/*.md"

  budget:
    name: Config Budget
    runs-on: "${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}"
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: domengabrovsek/github-actions/.github/actions/checkout@main

      - name: Check always-loaded rule budget
        run: ./scripts/config-budget.sh

  prose:
    name: Prose Gate
    runs-on: "${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}"
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: domengabrovsek/github-actions/.github/actions/checkout@main

      - name: Test the prose gate and scan the markdown corpus
        run: bash hooks/prose-gate.test.sh

  tests:
    name: Extension Tests
    runs-on: "${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}"
    timeout-minutes: 10
    steps:
      - name: Check out and set up Node
        uses: domengabrovsek/github-actions/.github/actions/setup-node-npm@main
        with:
          install: 'false'

      - name: Run pi extension tests
        run: npm test

  config:
    name: Config Integrity
    runs-on: "${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}"
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: domengabrovsek/github-actions/.github/actions/checkout@main

      - name: Check tracked configuration
        run: ./scripts/config-integrity.sh

      - name: Lint shell scripts
        run: ./scripts/shellcheck-all.sh

  shell-tests:
    name: Shell Tests
    runs-on: "${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}"
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: domengabrovsek/github-actions/.github/actions/checkout@main

      # The glob picks up a new suite without a workflow edit. Each suite gets
      # its own log group, and all run before the step reports which failed.
      - name: Run every shell suite
        run: |
          failed=""
          for t in tests/*.sh; do
            echo "::group::$t"
            bash "$t" || failed="$failed $t"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::Failed suites:$failed"
            exit 1
          fi

  # ==============================================
  # Gate
  # ==============================================
  # Single aggregator check every PR must pass. Branch protection requires the
  # "Gate" status, so required checks stay stable even as the jobs above change.
  gate:
    name: Gate
    if: always()
    needs:
      - lint
      - budget
      - prose
      - tests
      - shell-tests
      - config
    runs-on: "${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}"
    timeout-minutes: 1
    steps:
      - name: Check results
        run: |
          results=(
            "${{ needs.lint.result }}"
            "${{ needs.budget.result }}"
            "${{ needs.prose.result }}"
            "${{ needs.tests.result }}"
            "${{ needs.shell-tests.result }}"
            "${{ needs.config.result }}"
          )
          for r in "${results[@]}"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "One or more jobs failed or were cancelled."
              exit 1
            fi
          done
          echo "All jobs passed or were skipped."
