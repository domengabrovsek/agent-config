name: Pull Request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint Markdown
    runs-on: "${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}"
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: domengabrovsek/github-actions/.github/actions/checkout@main

      - name: Lint Markdown
        uses: domengabrovsek/github-actions/.github/actions/markdownlint@main
        with:
          globs: "**/*.md"

  budget:
    name: Config Budget
    runs-on: "${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}"
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: domengabrovsek/github-actions/.github/actions/checkout@main

      - name: Check always-loaded rule budget
        run: ./scripts/config-budget.sh

  tests:
    name: Extension Tests
    runs-on: "${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}"
    timeout-minutes: 10
    steps:
      - name: Check out and set up Node
        uses: domengabrovsek/github-actions/.github/actions/setup-node-npm@main
        with:
          install: 'false'

      - name: Run pi extension tests
        run: npm test

  config:
    name: Config Integrity
    runs-on: "${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}"
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: domengabrovsek/github-actions/.github/actions/checkout@main

      - name: Check tracked configuration
        run: ./scripts/config-integrity.sh

      - name: Lint shell scripts
        run: ./scripts/shellcheck-all.sh

  shell-tests:
    name: Shell Tests
    runs-on: "${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}"
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: domengabrovsek/github-actions/.github/actions/checkout@main

      # The glob picks up a new suite without a workflow edit. The suites run
      # in parallel, each into its own log, because each one works in its own
      # temp dir. The logs print in glob order, one group per suite, and the
      # step fails after listing every failed suite.
      - name: Run every shell suite
        run: |
          logs="$RUNNER_TEMP/shell-suites"
          mkdir -p "$logs"
          suites=(tests/*.sh)
          pids=()
          for t in "${suites[@]}"; do
            bash "$t" > "$logs/$(basename "$t").log" 2>&1 &
            pids+=("$!")
          done
          failed=""
          for i in "${!suites[@]}"; do
            t=${suites[$i]}
            if wait "${pids[$i]}"; then result=passed; else result=FAILED; failed="$failed $t"; fi
            echo "::group::$t ($result)"
            cat "$logs/$(basename "$t").log"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::Failed suites:$failed"
            exit 1
          fi

  # ==============================================
  # Gate
  # ==============================================
  # Single aggregator check every PR must pass. Branch protection requires the
  # "Gate" status, so required checks stay stable even as the jobs above change.
  gate:
    name: Gate
    if: always()
    needs:
      - lint
      - budget
      - tests
      - shell-tests
      - config
    runs-on: "${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}"
    timeout-minutes: 1
    steps:
      - name: Check results
        run: |
          results=(
            "${{ needs.lint.result }}"
            "${{ needs.budget.result }}"
            "${{ needs.tests.result }}"
            "${{ needs.shell-tests.result }}"
            "${{ needs.config.result }}"
          )
          for r in "${results[@]}"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "One or more jobs failed or were cancelled."
              exit 1
            fi
          done
          echo "All jobs passed or were skipped."
