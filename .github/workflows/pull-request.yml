name: Pull Request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint Markdown
    runs-on: "${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}"
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: domengabrovsek/github-actions/.github/actions/checkout@main

      - name: Lint Markdown
        uses: domengabrovsek/github-actions/.github/actions/markdownlint@main
        with:
          globs: "**/*.md"

  budget:
    name: Config Budget
    runs-on: "${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}"
    timeout-minutes: 10
    steps:
      - name: Check out and set up Node
        uses: domengabrovsek/github-actions/.github/actions/setup-node-npm@main
        with:
          install: 'false'

      - name: Check always-loaded rule budget
        run: npm run check:budget

  tests:
    name: Extension Tests
    runs-on: "${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}"
    timeout-minutes: 10
    steps:
      - name: Check out and set up Node
        uses: domengabrovsek/github-actions/.github/actions/setup-node-npm@main
        with:
          install: 'false'

      - name: Run pi extension tests
        run: npm test

  typecheck:
    name: Type Check
    runs-on: "${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}"
    timeout-minutes: 10
    steps:
      - name: Check out and set up Node
        uses: domengabrovsek/github-actions/.github/actions/setup-node-npm@main
        with:
          install: 'false'

      # npm ci also installs the Pi peer packages from the lockfile, so tsc checks against their real types.
      - name: Type-check TypeScript
        run: npm ci && npm run typecheck

  config:
    name: Config Integrity
    runs-on: "${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}"
    timeout-minutes: 10
    steps:
      - name: Check out and set up Node
        uses: domengabrovsek/github-actions/.github/actions/setup-node-npm@main
        with:
          install: 'false'

      - name: Check tracked configuration
        run: npm run check:config

      - name: Lint shell scripts
        run: npm run lint:shell

  shell-tests:
    name: Shell Tests
    runs-on: "${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}"
    timeout-minutes: 10
    steps:
      - name: Check out and set up Node
        uses: domengabrovsek/github-actions/.github/actions/setup-node-npm@main
        with:
          install: 'false'

      - name: Run every shell suite
        run: npm run test:shell

  # ==============================================
  # Gate
  # ==============================================
  # Single aggregator check every PR must pass. Branch protection requires the
  # "Gate" status, so required checks stay stable even as the jobs above change.
  gate:
    name: Gate
    if: always()
    needs:
      - lint
      - budget
      - tests
      - typecheck
      - shell-tests
      - config
    runs-on: "${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}"
    timeout-minutes: 1
    steps:
      - name: Check results
        run: |
          results=(
            "${{ needs.lint.result }}"
            "${{ needs.budget.result }}"
            "${{ needs.tests.result }}"
            "${{ needs.typecheck.result }}"
            "${{ needs.shell-tests.result }}"
            "${{ needs.config.result }}"
          )
          for r in "${results[@]}"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "One or more jobs failed or were cancelled."
              exit 1
            fi
          done
          echo "All jobs passed or were skipped."
