# ==============================================
# Reviewer
# ==============================================
# Runs the shared Claude reviewer from domengabrovsek/github-actions. It reads
# the Claude token from AWS SSM through the role in REVIEWER_ROLE_ARN, which
# home-infra's github stack sets, so this repo stores no token. It calls
# @main because the role only trusts reviewer.yml from main.

name: Reviewer

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
    branches: [main]
  pull_request_target:
    types: [labeled]
    branches: [main]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  reviewer:
    if: github.repository_owner == 'domengabrovsek'
    uses: domengabrovsek/github-actions/.github/workflows/reviewer.yml@main
    with:
      aws_role_arn: ${{ vars.REVIEWER_ROLE_ARN }}
